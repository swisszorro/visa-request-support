services:
  visa:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # mount source for live editing during development (remove in production)
      - ./src:/app/src
      - ./public:/app/public
      - ./resources:/app/resources
      - ./tests:/app/tests
      - ./config:/app/config
      - ./storage:/app/storage
    environment:
      # the built-in server is single-threaded: the client form calls this same service, so it needs >1 worker
      PHP_CLI_SERVER_WORKERS: "4"
    restart: unless-stopped
