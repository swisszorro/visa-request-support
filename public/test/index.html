<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BWC Visa Request – API Test</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --ok:#22c55e; --err:#ef4444; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--txt); }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--mut); margin: 0 0 24px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px;
          padding: 20px; margin-bottom: 18px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing:.06em; color: var(--mut);
       margin: 0 0 14px; }
  label { display:block; font-size: 13px; margin: 10px 0 4px; color: var(--mut); }
  input[type=text], input[type=url], input[type=password], input[type=file], input[type=email] {
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
    background:#0b1220; color:var(--txt); font-size:14px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
  button { background: var(--accent); color:#04293b; border:0; padding:11px 20px;
           border-radius:9px; font-weight:600; font-size:15px; cursor:pointer; margin-top:16px; }
  button:disabled { opacity:.5; cursor: progress; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background: rgba(34,197,94,.15); color: var(--ok); }
  .pill.err { background: rgba(239,68,68,.15); color: var(--err); }
  table { width:100%; border-collapse: collapse; font-size:13px; margin-top:8px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color: var(--mut); font-weight:600; }
  pre { background:#0b1220; padding:14px; border-radius:8px; overflow:auto; font-size:12px;
        max-height:340px; border:1px solid var(--line); }
  .hint { font-size:12px; color: var(--mut); margin-top:4px; }
  a.dl { color: var(--accent); font-weight:600; }
  .summary span { margin-right:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Berne World Cup · Visa Request API</h1>
  <p class="sub">Statische Testseite für den REST-Webservice <code>POST /api/visa-request</code>.</p>

  <form id="form">
    <div class="card">
      <h2>Verbindung</h2>
      <label>Base URL des Services</label>
      <input type="url" id="baseUrl" value="http://localhost:8080" />
      <!-- input type="url" id="baseUrl" value="https://visa.alpha-impact.swiss" / -->
      <label>API-Key (Authorization: Bearer …)</label>
      <input type="password" id="apiKey" placeholder="SERVICE_API_KEYS Wert" value="" />
    </div>

    <div class="card">
      <h2>Antragstellender Verband (Textfelder)</h2>
      <div class="grid">
        <div><label>Name</label><input type="text" id="name" value="Lang" /></div>
        <div><label>Vorname</label><input type="text" id="firstname" value="Daniel" /></div>
        <div><label>Adresse</label><input type="text" id="address" value="Haus des Sports, Talgut-Zentrum 27" /></div>
        <div><label>PLZ</label><input type="text" id="zip" value="3063" /></div>
        <div><label>Ort</label><input type="text" id="city" value="Ittigen" /></div>
        <div><label>Land</label><input type="text" id="country" value="Switzerland" /></div>
        <div><label>Nationaler Verband</label><input type="text" id="federation" value="Swiss Fencing" /></div>
        <div><label>E-Mailadresse</label><input type="email" id="email" value="daniel@lang.li" /></div>
      </div>
    </div>

    <div class="card">
      <h2>Dateien</h2>
      <label>Excel-Datei (Tabelle „Applicants“)</label>
      <input type="file" id="excel" accept=".xlsx" />
      <label>Passport-Bilder (max. 24 · png, jpg, gif, pdf)</label>
      <input type="file" id="images" accept=".png,.jpg,.jpeg,.gif,.pdf" multiple />
      <div class="hint" id="fileHint"></div>
    </div>

    <button type="submit" id="submit">Anfrage senden</button>
    <span id="status" style="margin-left:14px;"></span>
  </form>

  <div class="card" id="resultCard" style="display:none;">
    <h2>Ergebnis</h2>
    <div class="summary" id="summary"></div>
    <div id="pdfArea" style="margin:12px 0;"></div>

    <h2 style="margin-top:20px;">Erfolgreich</h2>
    <table id="okTable"><thead><tr><th>Name</th><th>Geburtsdatum</th></tr></thead><tbody></tbody></table>

    <h2 style="margin-top:20px;">Fehlerhaft</h2>
    <table id="failTable"><thead><tr><th>Name</th><th>Geburtsdatum</th><th>Abweichungen (Excel ↔ Pass)</th></tr></thead><tbody></tbody></table>

    <h2 style="margin-top:20px;">Rohantwort (JSON)</h2>
    <pre id="raw"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$('images').addEventListener('change', e => {
  const n = e.target.files.length;
  $('fileHint').textContent = n ? `${n} Bild(er) gewählt` + (n > 24 ? ' — zu viele! Max. 24.' : '') : '';
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const base = $('baseUrl').value.replace(/\/$/, '');
  const fd = new FormData();
  ['name','firstname','address','zip','city','country','federation','email'].forEach(f => fd.append(f, $(f).value));
  if ($('excel').files[0]) fd.append('excel', $('excel').files[0]);
  for (const f of $('images').files) fd.append('images[]', f);

  $('submit').disabled = true;
  $('status').textContent = 'Wird verarbeitet … (Bildanalyse kann etwas dauern)';

  try {
    const res = await fetch(base + '/api/visa-request', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + $('apiKey').value, 'X-API-Key': $('apiKey').value },
      body: fd
    });
    const data = await res.json();
    render(data, res.ok);
  } catch (err) {
    $('status').textContent = '';
    alert('Fehler: ' + err.message);
  } finally {
    $('submit').disabled = false;
  }
});

function render(data, ok) {
  $('status').textContent = '';
  $('resultCard').style.display = 'block';
  $('raw').textContent = JSON.stringify(data, null, 2);

  if (!data.ok) {
    $('summary').innerHTML = `<span class="pill err">Fehler</span> ${data.error || ''}`;
    $('okTable').querySelector('tbody').innerHTML = '';
    $('failTable').querySelector('tbody').innerHTML = '';
    $('pdfArea').innerHTML = '';
    return;
  }

  const s = data.summary || {};
  $('summary').innerHTML =
    `<span>Antragsteller: <b>${s.applicants_total ?? '–'}</b></span>` +
    `<span>Pässe erkannt: <b>${s.passports_detected ?? '–'}</b></span>` +
    `<span class="pill ok">${s.successful ?? 0} erfolgreich</span>` +
    `<span class="pill err">${s.failed ?? 0} fehlerhaft</span>`;

  if (data.document_base64) {
    const blob = b64toBlob(data.document_base64, data.document_mime || 'application/octet-stream');
    const url = URL.createObjectURL(blob);
    const label = (data.document_format || 'pdf').toUpperCase();
    $('pdfArea').innerHTML = `<a class="dl" href="${url}" download="${data.document_filename || 'invitation'}">⬇︎ Einladungsschreiben (${label}) herunterladen</a>`;
  }

  const okBody = $('okTable').querySelector('tbody');
  okBody.innerHTML = (data.successful || []).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.date_of_birth)}</td></tr>`).join('') || '<tr><td colspan="2">–</td></tr>';

  const failBody = $('failTable').querySelector('tbody');
  failBody.innerHTML = (data.failed || []).map(r => {
    const detail = (r.mismatches && r.mismatches.length)
      ? '<ul style="margin:0;padding-left:18px;">' + r.mismatches.map(m =>
          `<li><b>${esc(m.field)}</b>: Excel <code>${esc(m.expected||'–')}</code> ↔ Pass <code>${esc(m.found||'–')}</code></li>`
        ).join('') + '</ul>'
      : esc(r.reason || '');
    return `<tr><td>${esc(r.name)}</td><td>${esc(r.date_of_birth)}</td><td>${detail}</td></tr>`;
  }).join('') || '<tr><td colspan="3">–</td></tr>';
}

function esc(s){ return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function b64toBlob(b64, type){ const bin = atob(b64); const a = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type}); }
</script>
</body>
</html>
